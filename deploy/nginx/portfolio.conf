# Example Nginx site for the portfolio (PHP-FPM 8.4).
# Copy to /etc/nginx/sites-available/portfolio, replace example.com and the paths,
# enable it, then issue a certificate (e.g. `sudo certbot --nginx -d example.com`).

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    root /var/www/portfolio/public;
    index index.php;
    charset utf-8;

    # ssl_certificate / ssl_certificate_key are added by Certbot.

    # Uploads from the dashboard: CV (5 MB) and images (4 MB).
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output and fonts are fingerprinted: cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded images and their WebP variants.
    location /storage/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
