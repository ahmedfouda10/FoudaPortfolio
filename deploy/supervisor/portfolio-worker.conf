; Queue worker for the portfolio (contact-form emails, image variants).
; Copy to /etc/supervisor/conf.d/portfolio-worker.conf, adjust the paths and user, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start portfolio-worker:*

[program:portfolio-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/portfolio/artisan queue:work database --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/portfolio
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/portfolio/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
